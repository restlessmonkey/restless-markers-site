name: Bootstrap Restless Markers public site

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/bootstrap-restless-markers.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - name: Check out NCM source
        uses: actions/checkout@v6
        with:
          repository: restlessmonkey/NCM
          ref: main
          path: source

      - name: Check out Restless Markers public repository
        uses: actions/checkout@v6
        with:
          path: dest

      - name: Build browser-only Restless Markers repository
        shell: bash
        run: |
          set -euo pipefail

          find dest -mindepth 1 -maxdepth 1 ! -name .git ! -name .github -exec rm -rf {} +

          cp source/index.html source/app.js source/app-meta.json source/styles.css source/markers.json \
             source/site.webmanifest source/sw.js source/ca-enhancements.js source/ca-hmdb-poc.js \
             source/ca-hmdb-rich-details.js source/ca-berd-enrichment.js source/.nojekyll \
             source/THIRD-PARTY-NOTICES.md dest/
          cp -R source/data source/icons source/vendor dest/

          # Keep only California files the browser actually loads.
          find dest/data/states/ca -maxdepth 1 -type f \
            ! -name 'markers.json' \
            ! -name 'offline-lookups.json' \
            ! -name 'berd-landmark-enrichment.json' \
            -delete

          cat > dest/restless-markers-brand.js <<'JS'
          (function () {
            const BRAND = "Restless Markers";
            const TAGLINE = "Explore America’s historical markers";

            function isCalifornia() {
              const selector = document.getElementById("state-selector");
              return Boolean(selector && selector.value === "CA");
            }

            function applyBrand() {
              const title = document.getElementById("app-title");
              const subtitle = document.getElementById("app-subtitle");
              const aboutTitle = document.getElementById("about-dialog-title");
              const aboutButton = document.getElementById("about-btn");
              const report = document.getElementById("about-report-link");

              if (title) title.textContent = BRAND;
              if (subtitle && !isCalifornia()) subtitle.textContent = TAGLINE;
              if (aboutTitle) aboutTitle.textContent = "About Restless Markers";
              if (aboutButton) aboutButton.setAttribute("aria-label", "About Restless Markers");
              if (report && report.href) {
                report.href = report.href.replace(/Historical%20Markers%20Explorer/gi, "Restless%20Markers");
              }
            }

            function applyAfterStateChange() {
              [0, 25, 300, 650].forEach((delay) => setTimeout(applyBrand, delay));
            }

            document.addEventListener("DOMContentLoaded", () => {
              applyAfterStateChange();
              const selector = document.getElementById("state-selector");
              if (selector) selector.addEventListener("change", applyAfterStateChange);
            });
            window.addEventListener("load", applyAfterStateChange);
            applyBrand();
          })();
          JS

          python - <<'PY'
          import json
          from pathlib import Path

          root = Path('dest')

          index_path = root / 'index.html'
          index = index_path.read_text(encoding='utf-8')
          index = index.replace('<meta name="apple-mobile-web-app-title" content="Markers" />',
                                '<meta name="apple-mobile-web-app-title" content="Restless Markers" />')
          index = index.replace('<title>Texas Historical Markers</title>',
                                '<title>Restless Markers — Explore America’s historical markers</title>')
          index = index.replace('<h1 id="app-title">Texas Historical Markers</h1>',
                                '<h1 id="app-title">Restless Markers</h1>')
          index = index.replace('<p id="app-subtitle">Explore marker locations and read marker text.</p>',
                                '<p id="app-subtitle">Explore America’s historical markers</p>')
          index = index.replace('aria-label="About Historical Markers Explorer"',
                                'aria-label="About Restless Markers"')
          index = index.replace('<h2 id="about-dialog-title">About Historical Markers Explorer</h2>',
                                '<h2 id="about-dialog-title">About Restless Markers</h2>')
          index = index.replace('<option value="CA">California — Alameda Pilot (CA)</option>',
                                '<option value="CA">California — Historical Markers (CA)</option>')
          index = index.replace('One-time setup on the same Wi‑Fi as your computer: run <code>python serve.py</code> in the THM folder, then on the phone open <code>http://&lt;your-pc-ip&gt;:8080/</code> (not a file link). After that you can use the home-screen icon like an app. With internet on the phone, the map and lookups work fully; marker data is already on the device after the first load.',
                                'Open the Restless Markers website in Safari. After adding it to your Home Screen, you can launch it like an app. Marker data and the application shell are cached for offline use after they have been loaded.')
          index = index.replace('To refresh hosted data, use the marker-data tooling from the private source repository on a Windows computer. Texas and North Carolina have separate source scripts. The California Alameda County pilot is a reviewed snapshot and does not yet include an automated refresh script. The manual equivalents for TX and NC are <code>python -m pip install -r requirements.txt</code>, <code>python scripts/fetch_markers_data.py</code> plus <code>python scripts/build_offline_lookups.py</code> for Texas, or <code>python scripts/fetch_nc_markers.py</code> for North Carolina. Validate generated files before publishing a future multi-state site.',
                                'Marker-data refresh and validation are performed in the private canonical Restless Markers source repository, then validated browser-ready files are published here. The public site repository intentionally does not contain the ingestion, audit, or reconciliation tooling.')
          index = index.replace('On the public website, Cloudflare Web Analytics provides aggregate visits and performance statistics without analytics cookies or local storage. The application does not send marker searches, selected markers, or precise device location as custom analytics events.',
                                'Restless Markers does not currently send marker searches, selected markers, or precise device location as custom analytics events.')
          index = index.replace('Texas Historical Commission; OpenStreetMap contributors; Leaflet and Leaflet.markercluster; wordcloud2.js; Cloudflare Web Analytics.',
                                'Texas Historical Commission; OpenStreetMap contributors; Leaflet and Leaflet.markercluster; wordcloud2.js.')
          index = index.replace('Historical%20Markers%20Explorer%20v1.4.0%20feedback', 'Restless%20Markers%20feedback')
          # Remove the old THM-only Cloudflare beacon block; analytics stays disabled until intentionally configured for Restless Markers.
          start = index.find('    <!-- Cloudflare Web Analytics: public GitHub Pages deployment only -->')
          if start != -1:
              end = index.find('  </body>', start)
              if end != -1:
                  index = index[:start] + index[end:]
          if 'restless-markers-brand.js' not in index:
              index = index.replace('<script src="app.js?v=1.4.0"></script>',
                                    '<script src="app.js?v=1.4.0"></script>\n    <script src="restless-markers-brand.js?v=1"></script>')
          index_path.write_text(index, encoding='utf-8')

          manifest_path = root / 'site.webmanifest'
          manifest = json.loads(manifest_path.read_text(encoding='utf-8'))
          manifest['name'] = 'Restless Markers — Explore America’s historical markers'
          manifest['short_name'] = 'Restless Markers'
          manifest['description'] = 'Explore historical markers across America.'
          manifest_path.write_text(json.dumps(manifest, indent=2, ensure_ascii=False) + '\n', encoding='utf-8')

          ca_path = root / 'ca-hmdb-poc.js'
          ca = ca_path.read_text(encoding='utf-8')
          ca = ca.replace('const APP_TITLE = "California Historical Markers — NCM";',
                          'const APP_TITLE = "Restless Markers";')
          ca = ca.replace('NCM currently deploys', 'Restless Markers currently deploys')
          ca = ca.replace('NCM links a physical marker', 'Restless Markers links a physical marker')
          ca_path.write_text(ca, encoding='utf-8')

          sw_path = root / 'sw.js'
          sw = sw_path.read_text(encoding='utf-8')
          sw = sw.replace('historical-markers-ui-20260815-v1.4.6-ca-berd-public-ui',
                          'restless-markers-ui-20260816-v3')
          needle = '  "./app.js?v=1.4.0",\n'
          if 'restless-markers-brand.js' not in sw:
              sw = sw.replace(needle, needle + '  "./restless-markers-brand.js?v=1",\n')
          sw_path.write_text(sw, encoding='utf-8')

          meta_path = root / 'app-meta.json'
          meta = json.loads(meta_path.read_text(encoding='utf-8'))
          ca_meta = meta.get('datasets', {}).get('CA', {})
          ca_meta.pop('hmdbSeriesReportedCount', None)
          meta['analytics'] = {
              'provider': 'Cloudflare Web Analytics',
              'enabled': False,
              'host': 'restlessmonkey.github.io',
              'pathPrefix': '/restless-markers-site/',
              'cookies': False,
              'customEvents': False
          }
          meta_path.write_text(json.dumps(meta, indent=2, ensure_ascii=False) + '\n', encoding='utf-8')

          notices_path = root / 'THIRD-PARTY-NOTICES.md'
          notices = notices_path.read_text(encoding='utf-8')
          notices = notices.replace('THM-site distributes', 'Restless Markers distributes')
          if 'https://www.hmdb.org/' not in notices:
              notices += '''\n\n## Historical Marker Database (HMDB)\n\nWebsite: <https://www.hmdb.org/>\n\nThe Historical Marker Database is an outstanding independent resource for historical markers, photographs, inscriptions, and related historical information. Restless Markers encourages users to visit the original HMDB marker record whenever an HMDB source link is available.\n\nHMDB content is not licensed as Restless Markers application code. Copyright, licensing, terms of use, attribution requirements, and other rights applicable to HMDB content remain with HMDB and the applicable content owners.\n'''
          notices_path.write_text(notices, encoding='utf-8')
          PY

          cat > dest/README.md <<'MD'
          # Restless Markers

          **Explore America’s historical markers.**

          This is the public browser-ready deployment repository for Restless Markers.

          It intentionally contains only files needed by the public website and public marker datasets. Development, ingestion, audit, reconciliation, and validation tooling is maintained separately in the private canonical source repository.

          ## Data sources

          Restless Markers brings together historical-marker information from public state programs and other attributed sources. Third-party data and content remain subject to their respective rights, licenses, terms, and attribution requirements.

          **Historical Marker Database (HMDB): <https://www.hmdb.org/>**

          HMDB is an outstanding independent historical-marker resource. Where an HMDB source record is available, Restless Markers links users to the original HMDB marker page for additional information.

          See [`THIRD-PARTY-NOTICES.md`](THIRD-PARTY-NOTICES.md) for source and software acknowledgments.

          ## Licensing status

          No open-source license has been selected for the original Restless Markers application code at this time. The absence of a repository license does not alter the licenses or rights applicable to included third-party software or data.
          MD

      - name: Publish browser-ready repository
        working-directory: dest
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Publish Restless Markers public site"
          git push
